[general]
import = [
  "~/.config/alacritty/themes/themes/rose_pine_moon.toml"
]

[terminal]
shell = { program = "/bin/zsh", args = [ "-l", "-c", "tmux attach || tmux"] }

[window]
decorations = "None"
opacity = 0.9
startup_mode = "Maximized"

[colors]
transparent_background_colors = true

[font]
normal = { family = "SFMono Nerd Font", style = "Regular" }
bold = { family = "SFMono Nerd Font", style = "Semibold" }
size = 13
